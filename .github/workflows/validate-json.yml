name: Validate NGF•BTC•AM JSON

on:
  push:
    paths:
      - "ngf-asset.json"
      - "ngf-asset-schema.json"
      - ".github/workflows/validate-json.yml"
  pull_request:
    paths:
      - "ngf-asset.json"
      - "ngf-asset-schema.json"
      - ".github/workflows/validate-json.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON against Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install jsonschema
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate JSON with JSON Schema
        run: python -m jsonschema -i ngf-asset.json ngf-asset-schema.json
